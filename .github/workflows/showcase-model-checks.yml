name: Independent engineering model checks
on:
  push:
    branches:
      - main
      - "showcase/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate showcase tree and local links
        run: python3 scripts/validate_showcase.py
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Compile and execute contract checks
        run: dotnet run --project samples/independent-models/IndependentModels.csproj --configuration Release
